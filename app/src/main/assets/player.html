<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAXI tv — Lecteur</title>
<style>
  /* ====== MAXI player — même thème que l'appli ====== */
  :root { --bg:#050505; --text:#f5f5f5; --muted:rgba(255,255,255,.62); --line:rgba(255,255,255,.12);
          --glass:rgba(28,28,32,.66); --ease:cubic-bezier(.2,.8,.2,1); --live:#ff453a; }
  html { font-size:max(11px, calc(100vw / 120)); }          /* 1 rem = 16 px sur un écran de 1920 px : tout se met à l'échelle */
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:transparent; color:var(--text); user-select:none;
               font-family:'SF Pro Display','Segoe UI Variable Display','Segoe UI',system-ui,sans-serif; letter-spacing:-.01em; }
  body.web { background:#000; }
  button { font:inherit; color:inherit; border:0; background:none; padding:0; cursor:pointer; outline:none; }
  svg { display:block; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }

  #v { position:absolute; inset:0; width:100%; height:100%; background:#000; object-fit:contain; display:none; }
  body.web #v { display:block; }

  /* voiles : dégradé en haut et en bas pour que le texte reste lisible sur n'importe quelle image */
  .scrim { position:absolute; left:0; right:0; pointer-events:none; opacity:0; transition:opacity .35s var(--ease); }
  .scrim.t { top:0; height:20rem; background:linear-gradient(rgba(0,0,0,.78), rgba(0,0,0,0)); }
  .scrim.b { bottom:0; height:28rem; background:linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.86)); }
  body.ui .scrim { opacity:1; }

  /* haut : retour + titre */
  #top { position:absolute; top:0; left:0; right:0; padding:3rem 4rem; display:flex; align-items:center; gap:1.5rem;
         opacity:0; transform:translateY(-1rem); transition:opacity .35s var(--ease), transform .35s var(--ease); pointer-events:none; }
  body.ui #top { opacity:1; transform:none; pointer-events:auto; }
  .chip { display:flex; align-items:center; justify-content:center; width:3.6rem; height:3.6rem; border-radius:50%; flex:none;
          background:var(--glass); backdrop-filter:blur(30px) saturate(1.8); -webkit-backdrop-filter:blur(30px) saturate(1.8);
          border:1px solid rgba(255,255,255,.12); transition:transform .2s var(--ease), background .2s, box-shadow .2s; }
  .chip svg { width:1.6rem; height:1.6rem; }
  .chip:hover { background:rgba(255,255,255,.2); }
  #titles { min-width:0; }
  #title { font-size:2.1rem; font-weight:700; letter-spacing:-.03em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 2px 14px rgba(0,0,0,.55); }
  #tag { display:none; align-items:center; gap:.5rem; margin-top:.4rem; font-size:.95rem; font-weight:700; letter-spacing:.1em; color:var(--live); }
  #tag::before { content:''; width:.55rem; height:.55rem; border-radius:50%; background:var(--live); }
  body.live #tag { display:flex; }

  /* centre : icône de lecture / pause, retour visuel du saut, attente */
  #flash { position:absolute; left:50%; top:50%; width:8rem; height:8rem; margin:-4rem 0 0 -4rem; border-radius:50%; display:flex; align-items:center; justify-content:center;
           background:rgba(20,20,22,.55); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); opacity:0; transform:scale(.7); pointer-events:none; }
  #flash svg { width:3.4rem; height:3.4rem; fill:#fff; stroke:none; }
  #flash.go { animation:flash .6s var(--ease); }
  @keyframes flash { 0% { opacity:0; transform:scale(.7); } 25% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(1.15); } }
  .skipfx { position:absolute; top:50%; margin-top:-2rem; padding:1rem 1.6rem; border-radius:999px; font-size:1.5rem; font-weight:700; opacity:0; pointer-events:none;
            background:rgba(20,20,22,.6); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); }
  .skipfx.l { left:14%; } .skipfx.r { right:14%; }
  .skipfx.go { animation:skip .7s var(--ease); }
  @keyframes skip { 0% { opacity:0; transform:scale(.85); } 20% { opacity:1; transform:scale(1); } 100% { opacity:0; } }
  #spin { position:absolute; left:50%; top:50%; width:5rem; height:5rem; margin:-2.5rem 0 0 -2.5rem; border-radius:50%; border:.3rem solid rgba(255,255,255,.18); border-top-color:#fff;
          animation:spin 1s linear infinite; opacity:0; transition:opacity .25s; pointer-events:none; }
  body.wait #spin { opacity:1; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #err { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center; display:none; }
  #err b { display:block; font-size:2rem; margin-bottom:.6rem; } #err span { color:var(--muted); font-size:1.2rem; }
  body.fail #err { display:block; }

  /* bas : panneau de commandes */
  #bar { position:absolute; left:4rem; right:4rem; bottom:3.4rem; padding:1.8rem 2.4rem 2rem; border-radius:2.2rem;
         background:var(--glass); backdrop-filter:blur(40px) saturate(1.8); -webkit-backdrop-filter:blur(40px) saturate(1.8);
         border:1px solid rgba(255,255,255,.12); box-shadow:0 30px 80px rgba(0,0,0,.5);
         opacity:0; transform:translateY(2rem); transition:opacity .35s var(--ease), transform .35s var(--ease); pointer-events:none; }
  body.ui #bar { opacity:1; transform:none; pointer-events:auto; }

  #seekrow { display:flex; align-items:center; gap:1.4rem; }
  body.live #seekrow { display:none; }
  .time { font-size:1.15rem; font-weight:600; font-variant-numeric:tabular-nums; color:var(--muted); min-width:4.4rem; }
  .time.r { text-align:right; }
  #seek { position:relative; flex:1; height:2.4rem; display:flex; align-items:center; cursor:pointer; outline:none; border-radius:1rem; }
  #track { position:relative; width:100%; height:.5rem; border-radius:1rem; background:rgba(255,255,255,.2); transition:height .2s var(--ease); }
  #seek:hover #track, #seek.fo #track, #seek.drag #track { height:.8rem; }
  #buf, #fill { position:absolute; left:0; top:0; bottom:0; border-radius:1rem; }
  #buf { background:rgba(255,255,255,.28); width:0; }
  #fill { background:#fff; width:0; }
  #thumb { position:absolute; top:50%; width:1.7rem; height:1.7rem; margin:-.85rem 0 0 -.85rem; border-radius:50%; background:#fff; box-shadow:0 3px 14px rgba(0,0,0,.55);
           transform:scale(0); transition:transform .2s var(--ease); left:0; }
  #seek:hover #thumb, #seek.fo #thumb, #seek.drag #thumb { transform:scale(1); }
  #seek.fo { box-shadow:0 0 0 .3rem rgba(255,255,255,.35); }
  #hint { position:absolute; bottom:2.2rem; padding:.45rem .9rem; border-radius:.8rem; background:rgba(20,20,22,.85); font-size:1rem; font-weight:600; font-variant-numeric:tabular-nums;
          transform:translateX(-50%); opacity:0; pointer-events:none; transition:opacity .15s; }
  #seek:hover #hint, #seek.drag #hint { opacity:1; }

  #btnrow { display:flex; align-items:center; justify-content:space-between; margin-top:1rem; }
  body.live #btnrow { margin-top:0; }
  .grp { display:flex; align-items:center; gap:1.1rem; }
  .ctl { display:flex; align-items:center; justify-content:center; width:3.8rem; height:3.8rem; border-radius:50%; transition:transform .2s var(--ease), background .2s, box-shadow .2s, color .2s; }
  .ctl svg { width:2rem; height:2rem; }
  .ctl:hover { background:rgba(255,255,255,.16); }
  #play { width:5.2rem; height:5.2rem; background:#fff; color:#0a0a0a; box-shadow:0 8px 28px rgba(255,255,255,.18); }
  #play:hover { background:#fff; transform:scale(1.07); }
  #play svg { width:2.4rem; height:2.4rem; fill:currentColor; stroke:none; }
  body.live .skip { display:none; }

  /* les « encoches » : Image / Audio / Sous-titres */
  .notch { position:relative; display:flex; align-items:center; gap:.8rem; height:3.8rem; padding:0 1.5rem 0 1.2rem; border-radius:999px;
           background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.08); font-size:1.1rem; font-weight:600; white-space:nowrap;
           transition:transform .2s var(--ease), background .2s, box-shadow .2s, color .2s; }
  .notch svg { width:1.55rem; height:1.55rem; flex:none; }
  .notch small { display:block; font-size:.78rem; font-weight:500; color:var(--muted); margin-top:.1rem; transition:color .2s; }
  .notch .lb { display:flex; flex-direction:column; line-height:1.1; text-align:left; }
  .notch:hover { background:rgba(255,255,255,.2); }
  .notch.open { background:#fff; color:#0a0a0a; } .notch.open small { color:rgba(0,0,0,.55); }
  .notch.off { opacity:.45; }
  #notches { display:flex; align-items:center; gap:.9rem; }

  /* focus télécommande : même langage que l'appli (anneau blanc) */
  body.nav .chip:focus, body.nav .ctl:focus, body.nav .notch:focus { box-shadow:0 0 0 .28rem #fff, 0 12px 34px rgba(0,0,0,.55); transform:scale(1.08); }
  body.nav #play:focus { box-shadow:0 0 0 .28rem rgba(255,255,255,.55), 0 12px 34px rgba(0,0,0,.55); }
  body.nav .notch:focus { background:#fff; color:#0a0a0a; } body.nav .notch:focus small { color:rgba(0,0,0,.55); }

  /* menus déroulants au-dessus de l'encoche */
  .menu { position:absolute; bottom:calc(100% + 1rem); right:0; width:24rem; padding:1rem; border-radius:1.8rem; text-align:left;
          background:rgba(30,30,34,.9); backdrop-filter:blur(40px) saturate(1.8); -webkit-backdrop-filter:blur(40px) saturate(1.8);
          border:1px solid rgba(255,255,255,.14); box-shadow:0 30px 80px rgba(0,0,0,.6); color:var(--text);
          opacity:0; transform:translateY(.8rem) scale(.97); transform-origin:bottom right; pointer-events:none; transition:opacity .22s var(--ease), transform .22s var(--ease); }
  .notch.open .menu { opacity:1; transform:none; pointer-events:auto; }
  .menu h4 { margin:.3rem .8rem .7rem; font-size:.9rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .list { max-height:21rem; overflow-y:auto; scrollbar-width:none; } .list::-webkit-scrollbar { display:none; }
  .it { display:flex; align-items:center; justify-content:space-between; gap:1rem; height:3.5rem; padding:0 1rem 0 1.1rem; border-radius:1.1rem; font-size:1.15rem; font-weight:600; transition:background .15s; }
  .it .ck { width:1.3rem; height:1.3rem; opacity:0; flex:none; stroke-width:2.6; }
  .it.sel .ck { opacity:1; }
  .it:hover { background:rgba(255,255,255,.12); }
  .it.hl { background:#fff; color:#0a0a0a; }
  .it .sub { font-size:.85rem; font-weight:500; color:var(--muted); } .it.hl .sub { color:rgba(0,0,0,.55); }
  .it.none { color:var(--muted); font-weight:500; cursor:default; } .it.none:hover { background:none; }

  #sub { position:absolute; left:50%; bottom:4rem; transform:translateX(-50%); max-width:72%; text-align:center; font-size:2rem; line-height:1.3; font-weight:600; white-space:pre-line; padding:.35rem 1rem; border-radius:.9rem; background:rgba(0,0,0,.5); text-shadow:0 1px 3px rgba(0,0,0,.9); pointer-events:none; display:none; transition:bottom .35s var(--ease); }
  #sub.on { display:block; } body.ui #sub { bottom:15rem; }
  #toast { position:absolute; left:50%; top:3.4rem; transform:translate(-50%,-1rem); padding:.9rem 1.6rem; border-radius:999px; font-size:1.15rem; font-weight:600;
           background:var(--glass); backdrop-filter:blur(30px); -webkit-backdrop-filter:blur(30px); border:1px solid rgba(255,255,255,.12); opacity:0; pointer-events:none; transition:opacity .25s, transform .25s var(--ease); }
  #toast.on { opacity:1; transform:translate(-50%,0); }
  body.web:not(.ui) { cursor:none; }
  /* sur Fire TV la vidéo est derrière cette page transparente : le flou n'aurait rien à flouter, on l'enlève (plus léger) et on opacifie un peu */
  body.native * { backdrop-filter:none !important; -webkit-backdrop-filter:none !important; }
  body.native { --glass:rgba(26,26,30,.84); }
  body.native .menu { background:rgba(30,30,34,.96); }
  body.native #flash, body.native .skipfx { background:rgba(24,24,28,.8); }
</style>
</head>
<body>
<video id="v" playsinline></video>
<div class="scrim t"></div><div class="scrim b"></div>

<div id="top">
  <button class="chip" id="back" aria-label="Retour"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div id="titles"><div id="title"></div><div id="tag">EN DIRECT</div></div>
</div>

<div id="spin"></div>
<div id="flash"></div>
<div class="skipfx l" id="fxl">−10 s</div><div class="skipfx r" id="fxr">+10 s</div>
<div id="err"><b>Lecture impossible</b><span>Appuie sur Retour pour revenir.</span></div>
<div id="sub"></div>
<div id="toast"></div>

<div id="bar">
  <div id="seekrow">
    <span class="time" id="tcur">0:00</span>
    <div id="seek" tabindex="0"><div id="track"><div id="buf"></div><div id="fill"></div><div id="thumb"></div><div id="hint">0:00</div></div></div>
    <span class="time r" id="tdur">0:00</span>
  </div>
  <div id="btnrow">
    <div class="grp">
      <button class="ctl skip" id="rew" aria-label="Reculer de 10 secondes"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v4.5h4.5"/><path d="M9.4 9.8v4.6M12.2 9.8h2.2a1 1 0 0 1 1 1v2.6a1 1 0 0 1-1 1h-2.2z" stroke-width="1.6"/></svg></button>
      <button class="ctl" id="play" aria-label="Lecture / pause"></button>
      <button class="ctl skip" id="fwd" aria-label="Avancer de 10 secondes"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.5h-4.5"/><path d="M9.4 9.8v4.6M12.2 9.8h2.2a1 1 0 0 1 1 1v2.6a1 1 0 0 1-1 1h-2.2z" stroke-width="1.6"/></svg></button>
    </div>
    <div id="notches">
      <button class="notch" id="nImg" aria-label="Taille de l'image">
        <svg viewBox="0 0 24 24"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/></svg>
        <span class="lb">Image<small id="vImg">Ajusté</small></span>
        <div class="menu"><h4>Taille de l'image</h4><div class="list"></div></div>
      </button>
      <button class="notch" id="nAud" aria-label="Langue audio">
        <svg viewBox="0 0 24 24"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 10.5v3"/></svg>
        <span class="lb">Audio<small id="vAud">Par défaut</small></span>
        <div class="menu"><h4>Langue</h4><div class="list"></div></div>
      </button>
      <button class="notch" id="nTxt" aria-label="Sous-titres">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7.5 11.5h3M13.5 11.5h3M7.5 15h5M14.5 15h2"/></svg>
        <span class="lb">Sous-titres<small id="vTxt">Désactivés</small></span>
        <div class="menu"><h4>Sous-titres</h4><div class="list"></div></div>
      </button>
      <button class="ctl" id="full" aria-label="Plein écran" style="display:none"><svg viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg></button>
    </div>
  </div>
</div>

<script src="node_modules/hls.js/dist/hls.min.js"></script>
<script src="hls.min.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const MODE = Q.get('mode') === 'native' ? 'native' : 'web';          // native : l'image vient d'ExoPlayer (Fire TV), cette page n'affiche que l'interface
const URL_ = Q.get('u') || '', TITLE = Q.get('t') || '';
const ALTS = (() => {                                                 // PC : si le format demandé ne passe pas, on essaie les autres formats du même titre
  if (Q.get('mode') === 'native') return [];
  const m = URL_.match(/^(.*\/(?:movie|series)\/[^/]+\/[^/]+\/\d+)\.([A-Za-z0-9]+)(\?.*)?$/); if (!m) return [];
  return ['m3u8', 'mp4', 'mkv'].filter(x => x !== m[2].toLowerCase()).map(x => m[1] + '.' + x);
})();
const LIVE = /\/live\//.test(URL_) || Q.get('live') === '1';
document.body.classList.add(MODE);
if (LIVE) document.body.classList.add('live');
$('title').textContent = TITLE;

const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11-6.8a1 1 0 0 0 0-1.72l-11-6.8A1 1 0 0 0 8 5.2z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.3"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.3"/></svg>';
const CHECK = '<svg class="ck" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

// ---------- état commun ----------
const S = { pos: 0, dur: 0, buf: 0, playing: false, wait: true, audio: [], text: [], fit: 'fit', fail: false };
const FITS = [{ id: 'fit', label: 'Ajusté', sub: 'Image entière' }, { id: 'fill', label: 'Remplir', sub: 'Recadre les bords' }, { id: 'stretch', label: 'Étirer', sub: 'Déforme l’image' }];

// ---------- adaptateur « web » (PC) : <video> + hls.js ----------
const V = $('v');
const web = {
  hls: null,
  init() {
    V.addEventListener('timeupdate', () => { S.pos = V.currentTime; render(); });
    V.addEventListener('durationchange', () => { S.dur = isFinite(V.duration) ? V.duration : 0; render(); });
    V.addEventListener('progress', () => { try { S.buf = V.buffered.length ? V.buffered.end(V.buffered.length - 1) : 0; } catch (e) {} render(); });
    V.addEventListener('play', () => { S.playing = true; render(); });
    V.addEventListener('pause', () => { S.playing = false; render(); showUI(); });
    V.addEventListener('waiting', () => { S.wait = true; render(); });
    V.addEventListener('playing', () => { S.wait = false; S.playing = true; render(); });
    V.addEventListener('canplay', () => { S.wait = false; render(); });
    V.addEventListener('error', () => { if (web.hls) return; if (web.cur !== V.getAttribute('src')) return; web.cur = null; fail(); });
    V.addEventListener('click', () => { toggle(); });
    V.addEventListener('dblclick', toggleFull);
    const upd = () => { this.tracks(); render(); };
    try { V.audioTracks && V.audioTracks.addEventListener('change', upd); V.audioTracks && V.audioTracks.addEventListener('addtrack', upd); } catch (e) {}
    V.textTracks.addEventListener('addtrack', upd); V.textTracks.addEventListener('change', upd);
    this.upd = upd; this.load(URL_);
  },
  load(u) {
    try { if (this.hls) { this.hls.destroy(); this.hls = null; } } catch (e) {}
    S.fail = false; S.wait = true; render();
    if (/\.m3u8(\?|$)/.test(u) && window.Hls && Hls.isSupported()) {
      const upd = this.upd, h = this.hls = new Hls({ maxBufferLength: 30, capLevelToPlayerSize: false });
      h.loadSource(u); h.attachMedia(V);
      h.on(Hls.Events.MANIFEST_PARSED, () => { V.play().catch(() => {}); upd(); });
      h.on(Hls.Events.AUDIO_TRACKS_UPDATED, upd); h.on(Hls.Events.SUBTITLE_TRACKS_UPDATED, upd);
      h.on(Hls.Events.AUDIO_TRACK_SWITCHED, upd); h.on(Hls.Events.SUBTITLE_TRACK_SWITCH, upd);
      h.on(Hls.Events.ERROR, (e, d) => { if (d.fatal && h === this.hls) fail(); });
    } else { this.cur = u; V.src = u; V.play().catch(() => {}); }
  },
  tracks() {
    const a = [], t = [];
    if (this.hls && this.hls.audioTracks.length) this.hls.audioTracks.forEach((x, i) => a.push({ id: i, label: x.name || langName(x.lang) || ('Piste ' + (i + 1)), sel: this.hls.audioTrack === i }));
    else if (V.audioTracks && V.audioTracks.length) for (let i = 0; i < V.audioTracks.length; i++) { const x = V.audioTracks[i]; a.push({ id: i, label: langName(x.language) || x.label || ('Piste ' + (i + 1)), sel: x.enabled }); }
    if (this.hls && this.hls.subtitleTracks.length) this.hls.subtitleTracks.forEach((x, i) => t.push({ id: i, label: x.name || langName(x.lang) || ('Piste ' + (i + 1)), sel: this.hls.subtitleTrack === i }));
    else for (let i = 0; i < V.textTracks.length; i++) { const x = V.textTracks[i]; if (x.kind === 'subtitles' || x.kind === 'captions') t.push({ id: i, label: langName(x.language) || x.label || ('Piste ' + (i + 1)), sel: x.mode === 'showing' }); }
    S.audio = a; S.text = t;
  },
  toggle() { V.paused ? V.play().catch(() => {}) : V.pause(); },
  seekTo(s) { try { V.currentTime = Math.max(0, S.dur ? Math.min(S.dur, s) : s); } catch (e) {} },
  seekBy(d) { this.seekTo(V.currentTime + d); },
  setFit(m) { V.style.objectFit = m === 'fill' ? 'cover' : m === 'stretch' ? 'fill' : 'contain'; },
  selectAudio(id) { if (this.hls) this.hls.audioTrack = id; else if (V.audioTracks) for (let i = 0; i < V.audioTracks.length; i++) V.audioTracks[i].enabled = i === id; this.tracks(); render(); },
  selectText(id) {
    if (this.hls && this.hls.subtitleTracks.length) { this.hls.subtitleTrack = id; for (const x of V.textTracks) x.mode = id < 0 ? 'disabled' : 'showing'; }
    else for (let i = 0; i < V.textTracks.length; i++) V.textTracks[i].mode = i === id ? 'showing' : 'disabled';
    this.tracks(); render();
  },
  close() { try { V.pause(); if (this.hls) this.hls.destroy(); V.removeAttribute('src'); V.load(); } catch (e) {} leave(); }
};

// ---------- adaptateur « natif » (Fire TV) : commandes envoyées à ExoPlayer ----------
const NT = window.__NT || '';
const NP = window.NativePlayer;
const native = {
  init() {},
  toggle() { NP.toggle(NT); }, seekTo(s) { NP.seekTo(Math.max(0, Math.round(s * 1000)), NT); }, seekBy(d) { NP.seekBy(Math.round(d * 1000), NT); },

// appelé par Android environ deux fois par seconde
window.MP = {
  state(s) {
    if (typeof s === 'string') { try { s = JSON.parse(s); } catch (e) { return; } }
    S.at = performance.now(); S.pos = s.pos || 0; S.dur = s.dur || 0; S.buf = s.buf || 0; S.playing = !!s.playing; S.wait = !!s.wait;
    S.audio = s.audio || []; S.text = s.text || [];
    if (s.fail) fail();
    render();
  },
  back() { return backKey(); },                 // Retour de la télécommande : true si la page a géré la touche
  key(k) { return onKey({ key: k, preventDefault() {} }); }
};
const A = MODE === 'native' ? native : web;

// ---------- utilitaires ----------
const LANGS = { fr: 'Français', fra: 'Français', fre: 'Français', en: 'Anglais', eng: 'Anglais', es: 'Espagnol', spa: 'Espagnol', de: 'Allemand', ger: 'Allemand', deu: 'Allemand',
  it: 'Italien', ita: 'Italien', pt: 'Portugais', por: 'Portugais', ar: 'Arabe', ara: 'Arabe', tr: 'Turc', tur: 'Turc', nl: 'Néerlandais', nld: 'Néerlandais', ru: 'Russe', rus: 'Russe',
  ja: 'Japonais', jpn: 'Japonais', ko: 'Coréen', kor: 'Coréen', zh: 'Chinois', zho: 'Chinois', pl: 'Polonais', pol: 'Polonais', und: '' };
const langName = c => { if (!c) return ''; const k = String(c).toLowerCase().split(/[-_]/)[0]; return k in LANGS ? LANGS[k] : String(c).toUpperCase(); };
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
let toastT; function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800); }

// ---------- affichage ----------
let lastPlaying = null;
function render() {
  const B = document.body;
  B.classList.toggle('wait', S.wait && !S.fail); B.classList.toggle('fail', S.fail);
  if (lastPlaying !== S.playing) { $('play').innerHTML = S.playing ? ICON_PAUSE : ICON_PLAY; lastPlaying = S.playing; }
  if (!LIVE && !drag) {
    const p = S.dur ? Math.min(1, S.pos / S.dur) : 0;
    $('fill').style.width = (p * 100) + '%'; $('thumb').style.left = (p * 100) + '%';
    $('buf').style.width = (S.dur ? Math.min(1, S.buf / S.dur) * 100 : 0) + '%';
    $('tcur').textContent = fmt(S.pos); $('tdur').textContent = S.dur ? '−' + fmt(S.dur - S.pos) : '0:00';
  }
  const f = FITS.find(x => x.id === S.fit) || FITS[0]; $('vImg').textContent = f.label;
  const sa = S.audio.find(x => x.sel); $('vAud').textContent = sa ? sa.label : (S.audio.length ? 'Par défaut' : 'Piste unique');
  const st = S.text.find(x => x.sel), os = OS.list.find(x => x.id === OS.sel); $('vTxt').textContent = os ? os.label + ' · en ligne' : st ? st.label : (S.text.length || OS.list.length ? 'Désactivés' : OS.state === 'loading' ? 'Recherche…' : 'Aucun');
  $('nAud').classList.toggle('off', !S.audio.length); $('nTxt').classList.toggle('off', !S.text.length && !OS.list.length && OS.state !== 'loading' && OS.state !== 'nokey');
  if (menu) buildMenu(menu.which, true);
}
function flash(icon) { const f = $('flash'); f.innerHTML = icon; f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }
function fx(side) { const e = $(side === 'l' ? 'fxl' : 'fxr'); e.classList.remove('go'); void e.offsetWidth; e.classList.add('go'); }
let failAt = 0;
function fail() {
  if (MODE === 'web' && ALTS.length) { toast('Autre format…'); web.load(ALTS.shift()); return; }
  S.fail = true; S.wait = false; render(); showUI(true); }

// ---------- barre visible / cachée ----------
let uiT, uiOn = false;
function showUI(stay) {
  uiOn = true; document.body.classList.add('ui');
  clearTimeout(uiT);
  if (!stay) uiT = setTimeout(() => { if (!menu && S.playing && !S.fail) hideUI(); }, 4500);
}
function hideUI() { uiOn = false; document.body.classList.remove('ui'); if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur(); }

// ---------- actions ----------
function toggle() { A.toggle(); flash(S.playing ? ICON_PAUSE : ICON_PLAY); showUI(); }
function skip(d) { if (LIVE) return; A.seekBy(d); S.pos = Math.max(0, Math.min(S.dur || 1e9, S.pos + d)); render(); fx(d < 0 ? 'l' : 'r'); showUI(); }
function leave() {
  if (window.parent && window.parent !== window) window.parent.postMessage({ maxi: 'player-close' }, '*');
  else if (history.length > 1) history.back(); else window.close();
}
function toggleFull() { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (e) {} }

// ---------- barre de progression (souris) ----------
let drag = false;
const seekAt = x => { const r = $('track').getBoundingClientRect(); return Math.max(0, Math.min(1, (x - r.left) / r.width)); };
$('seek').addEventListener('pointerdown', e => { if (LIVE || !S.dur) return; drag = true; $('seek').classList.add('drag'); $('seek').setPointerCapture(e.pointerId); move(e); });
$('seek').addEventListener('pointermove', e => { const p = seekAt(e.clientX); $('hint').style.left = (p * 100) + '%'; $('hint').textContent = fmt(p * S.dur); if (drag) move(e); });
$('seek').addEventListener('pointerup', e => { if (!drag) return; drag = false; $('seek').classList.remove('drag'); A.seekTo(seekAt(e.clientX) * S.dur); S.pos = seekAt(e.clientX) * S.dur; render(); });
function move(e) { const p = seekAt(e.clientX); $('fill').style.width = (p * 100) + '%'; $('thumb').style.left = (p * 100) + '%'; $('tcur').textContent = fmt(p * S.dur); }

// ---------- sous-titres en ligne (wyzie.io) : trouvés d'après l'identifiant TMDB du film, affichés par cette page ----------
const OS = { list: [], sel: null, cues: [], off: 0, state: 'idle', i: 0 };
let SQ = null, SK = '';
try { SQ = JSON.parse(localStorage.getItem('subq') || 'null'); SK = localStorage.getItem('subkey') || ''; } catch (e) {}
if (SQ && Date.now() - (SQ.t || 0) > 6 * 3600e3) SQ = null;
const netGet = u => fetch(MODE === 'native' ? 'https://maxi.proxy/f?u=' + encodeURIComponent(u) : u);
const WZ = /^https:\/\/([a-z0-9-]+\.)*wyzie\.io\//i;
async function osSearch() {
  if (LIVE || !SQ || !SQ.id) { OS.state = 'none'; return; }
  if (!SK) { OS.state = 'nokey'; return; }
  OS.state = 'loading'; render();
  try {
    let u = 'https://sub.wyzie.io/search?id=' + encodeURIComponent(SQ.id) + '&language=fr,en&format=srt&key=' + encodeURIComponent(SK);
    if (SQ.type === 'series' && SQ.s && SQ.e) u += '&season=' + encodeURIComponent(SQ.s) + '&episode=' + encodeURIComponent(SQ.e);
    const r = await netGet(u); if (!r.ok) throw new Error('http ' + r.status);
    const arr = await r.json(), by = {};
    (Array.isArray(arr) ? arr : []).filter(x => x && WZ.test(x.url || '')).sort((a, b) => (a.isHearingImpaired ? 1 : 0) - (b.isHearingImpaired ? 1 : 0) || (b.downloadCount || 0) - (a.downloadCount || 0))
      .forEach(x => { const l = String(x.language || '').slice(0, 2).toLowerCase(); (by[l] = by[l] || []).push(x); });
    OS.list = [];
    for (const l of ['fr', 'en']) (by[l] || []).slice(0, 3).forEach((x, i) => OS.list.push({ id: 'o' + OS.list.length, label: langName(l) + (i ? ' ' + (i + 1) : ''), url: x.url }));
    OS.state = OS.list.length ? 'ready' : 'none';
    if (OS.list.length && !S.text.length) toast('Sous-titres trouvés en ligne');
  } catch (e) { OS.state = 'err'; }
  render();
}
function parseSub(t) {
  const out = [], tm = /(?:(\d+):)?(\d+):(\d+)[,.](\d+)\s*-->\s*(?:(\d+):)?(\d+):(\d+)[,.](\d+)/;
  for (const b of t.replace(/^\uFEFF/, '').replace(/\r/g, '').split(/\n\n+/)) {
    const L = b.split('\n'), i = L.findIndex(l => tm.test(l)); if (i < 0) continue; const m = L[i].match(tm);
    const a = (+m[1] || 0) * 3600 + +m[2] * 60 + +m[3] + +('0.' + m[4]), e = (+m[5] || 0) * 3600 + +m[6] * 60 + +m[7] + +('0.' + m[8]);
    const text = L.slice(i + 1).join('\n').replace(/<[^>]+>/g, '').replace(/\{[^}]*\}/g, '').trim(); if (text) out.push({ a, e, text });
  }
  return out;
}
async function osLoad(o) {
  toast('Chargement des sous-titres…');
  try {
    const r = await netGet(o.url); if (!r.ok) throw new Error('http ' + r.status);
    const buf = await r.arrayBuffer(); let t = new TextDecoder('utf-8').decode(buf); if (t.includes('\uFFFD')) t = new TextDecoder('windows-1252').decode(buf);
    const c = parseSub(t); if (!c.length) throw new Error('vide');
    if (OS.sel !== o.id) return; OS.cues = c; OS.i = 0; toast('Sous-titres : ' + o.label);
  } catch (e) { if (OS.sel === o.id) { OS.sel = null; OS.cues = []; toast('Sous-titres indisponibles'); } }
  render();
}
const curPos = () => MODE === 'web' ? V.currentTime : S.pos + (S.playing && !S.wait && S.at ? (performance.now() - S.at) / 1000 : 0);
setInterval(() => {
  const el = $('sub'); if (OS.sel == null || !OS.cues.length) { el.classList.remove('on'); return; }
  const p = curPos() - OS.off, C = OS.cues;
  if (!(C[OS.i] && C[OS.i].a <= p && p < C[OS.i].e)) { const j = C.findIndex(c => c.a <= p && p < c.e); OS.i = j < 0 ? 0 : j; if (j < 0) { el.classList.remove('on'); return; } }
  const t = C[OS.i].text; if (el.textContent !== t) el.textContent = t; el.classList.add('on');
}, 200);
function txtItems() {
  const emb = S.text.map(a => ({ id: a.id, label: a.label, sel: a.sel && OS.sel == null }));
  const on = OS.list.map(o => ({ id: o.id, label: o.label, sub: 'en ligne', sel: OS.sel === o.id }));
  if (!emb.length && !on.length) return [{ none: true, label: OS.state === 'loading' ? 'Recherche de sous-titres…' : OS.state === 'nokey' ? 'Sous-titres en ligne : clé manquante' : 'Aucun sous-titre disponible' }];
  const r = [{ id: -1, label: 'Désactivés', sel: OS.sel == null && !S.text.some(x => x.sel) }, ...emb, ...on];
  if (OS.state === 'loading') r.push({ none: true, label: 'Recherche en ligne…' });
  if (OS.sel != null) r.push({ id: 'adj-', label: 'Retarder de 0,5 s', sub: (OS.off >= 0 ? '+' : '') + OS.off.toFixed(1) + ' s' }, { id: 'adj+', label: 'Avancer de 0,5 s', sub: (OS.off >= 0 ? '+' : '') + OS.off.toFixed(1) + ' s' });
  return r;
}
function pickTxt(id) {
  if (id === 'adj-' || id === 'adj+') { OS.off += id === 'adj+' ? -.5 : .5; toast('Décalage : ' + (OS.off >= 0 ? '+' : '') + OS.off.toFixed(1) + ' s'); return 'keep'; }
  const o = OS.list.find(x => x.id === id);
  if (o) { A.selectText(-1); OS.sel = o.id; OS.cues = []; OS.off = 0; osLoad(o); render(); return; }
  OS.sel = null; OS.cues = []; A.selectText(id); toast(id < 0 ? 'Sous-titres désactivés' : 'Sous-titres : ' + ((S.text.find(x => x.id === id) || {}).label || ''));
}

// ---------- menus (Image / Audio / Sous-titres) ----------
let menu = null;                       // { which, idx }
const MENUS = {
  img: { btn: 'nImg', items: () => FITS.map(f => ({ id: f.id, label: f.label, sub: f.sub, sel: S.fit === f.id })), pick: id => { S.fit = id; A.setFit(id); toast('Image : ' + FITS.find(x => x.id === id).label); } },
  aud: { btn: 'nAud', items: () => S.audio.length ? S.audio.map(a => ({ id: a.id, label: a.label, sel: a.sel })) : [{ none: true, label: 'Une seule langue disponible' }], pick: id => { A.selectAudio(id); const a = S.audio.find(x => x.id === id); toast('Audio : ' + (a ? a.label : '')); } },
  txt: { btn: 'nTxt', items: txtItems, pick: pickTxt }
};
function buildMenu(which, keep) {
  const M = MENUS[which], list = $(M.btn).querySelector('.list'), items = M.items();
  const idx = keep && menu ? menu.idx : Math.max(0, items.findIndex(x => x.sel));
  list.innerHTML = '';
  items.forEach((it, i) => {
    const d = document.createElement('div'); d.className = 'it' + (it.sel ? ' sel' : '') + (it.none ? ' none' : '') + (menu && i === idx ? ' hl' : '');
    const l = document.createElement('div'); l.textContent = it.label;
    if (it.sub) { const s = document.createElement('div'); s.className = 'sub'; s.textContent = it.sub; l.appendChild(s); }
    d.appendChild(l); d.insertAdjacentHTML('beforeend', CHECK);
    if (!it.none) d.onclick = e => { e.stopPropagation(); if (M.pick(it.id) !== 'keep') closeMenu(); else buildMenu(menu.which, true); };
    list.appendChild(d);
  });
  if (menu) { menu.idx = idx; menu.n = items.length; const h = list.children[idx]; if (h && h.scrollIntoView) h.scrollIntoView({ block: 'nearest' }); }
  return items;
}
function openMenu(which) {
  closeMenu(); menu = { which, idx: 0, n: 0 };
  const items = buildMenu(which, false);
  menu.idx = Math.max(0, items.findIndex(x => x.sel)); buildMenu(which, true);
  $(MENUS[which].btn).classList.add('open'); showUI(true);
}
function closeMenu() {
  if (!menu) return false; const b = $(MENUS[menu.which].btn); b.classList.remove('open'); menu = null; showUI(); return true;
}
for (const w of ['img', 'aud', 'txt']) $(MENUS[w].btn).addEventListener('click', e => {
  if (e.target.closest('.menu')) return;
  if (!MENUS[w].items()[0] || MENUS[w].items()[0].none) { toast(w === 'aud' ? 'Une seule langue disponible' : 'Aucun sous-titre disponible'); return; }
  menu && menu.which === w ? closeMenu() : openMenu(w);
});

// ---------- boutons ----------
$('back').onclick = () => A.close();
$('play').onclick = toggle; $('rew').onclick = () => skip(-10); $('fwd').onclick = () => skip(10);
$('full').onclick = toggleFull; if (MODE === 'web') $('full').style.display = 'flex';
document.addEventListener('mousemove', () => { if (MODE === 'web') showUI(); });
document.addEventListener('click', e => { if (menu && !e.target.closest('.notch')) closeMenu(); });

// ---------- clavier / télécommande ----------
// rangées de boutons accessibles à la télécommande : 0 = retour, 1 = barre de progression, 2 = boutons
const rows = () => [[$('back')], LIVE ? [] : [$('seek')], [...(LIVE ? [] : [$('rew')]), $('play'), ...(LIVE ? [] : [$('fwd')]), $('nImg'), $('nAud'), $('nTxt'), ...(MODE === 'web' ? [$('full')] : [])]].map(r => r.filter(Boolean));
function focusEl(e) { document.body.classList.add('nav'); e.focus({ preventScroll: true }); $('seek').classList.toggle('fo', e === $('seek')); }
function where() { const a = document.activeElement, R = rows(); for (let i = 0; i < R.length; i++) { const j = R[i].indexOf(a); if (j >= 0) return [i, j]; } return null; }
function backKey() { if (closeMenu()) return true; if (S.fail) { A.close(); return true; } return false; }
function onKey(e) {
  const k = e.key;
  document.body.classList.toggle('nav', k.startsWith('Arrow') || k === 'Enter' || k === 'Tab' || document.body.classList.contains('nav'));
  if (k === 'Escape' || k === 'Backspace' || k === 'BrowserBack' || k === 'GoBack') { if (!backKey()) A.close(); e.preventDefault(); return true; }
  if (k === 'MediaPlayPause' || k === 'p' || (k === 'MediaPlay' && !S.playing) || (k === 'MediaPause' && S.playing)) { toggle(); e.preventDefault(); return true; }
  if (k === 'MediaPlay' || k === 'MediaPause') { e.preventDefault(); return true; }
  if (k === 'MediaFastForward') { skip(30); return true; } if (k === 'MediaRewind') { skip(-30); return true; }
  if (k === 'f' && MODE === 'web') { toggleFull(); return true; }
  if (menu) {                                                    // un menu est ouvert : haut/bas pour choisir, OK pour valider
    if (k === 'ArrowUp') menu.idx = (menu.idx - 1 + menu.n) % menu.n;
    else if (k === 'ArrowDown') menu.idx = (menu.idx + 1) % menu.n;
    else if (k === 'ArrowLeft' || k === 'ArrowRight') { const w = menu.which, o = ['img', 'aud', 'txt'], i = o.indexOf(w) + (k === 'ArrowRight' ? 1 : -1); if (o[i]) { openMenu(o[i]); focusEl($(MENUS[o[i]].btn)); } e.preventDefault(); return true; }
    else if (k === 'Enter' || k === ' ') { const it = MENUS[menu.which].items()[menu.idx]; if (it && !it.none && MENUS[menu.which].pick(it.id) === 'keep') { buildMenu(menu.which, true); showUI(true); e.preventDefault(); return true; } closeMenu(); e.preventDefault(); return true; }
    else return false;
    buildMenu(menu.which, true); showUI(true); e.preventDefault(); return true;
  }
  if (!uiOn) {                                                   // barre cachée : les flèches servent au saut et à l'affichage
    if (k === 'Enter' || k === ' ') { toggle(); e.preventDefault(); return true; }
    if (k === 'ArrowLeft') { skip(-10); e.preventDefault(); return true; }
    if (k === 'ArrowRight') { skip(10); e.preventDefault(); return true; }
    if (k === 'ArrowUp' || k === 'ArrowDown') { showUI(); focusEl($('play')); e.preventDefault(); return true; }
    return false;
  }
  showUI();
  const w = where(), R = rows();
  if (!w) {                                                      // rien de sélectionné : gauche/droite sautent, haut/bas sélectionnent les boutons
    if (k === 'ArrowLeft') skip(-10); else if (k === 'ArrowRight') skip(10);
    else if (k === 'Enter' || k === ' ') toggle();
    else if (k === 'ArrowUp' || k === 'ArrowDown') focusEl($('play'));
    else return false;
    e.preventDefault(); return true;
  }
  const [r, c] = w, cur = R[r][c];
  if (k === 'ArrowLeft') { if (cur === $('seek')) skip(-10); else if (R[r][c - 1]) focusEl(R[r][c - 1]); }
  else if (k === 'ArrowRight') { if (cur === $('seek')) skip(10); else if (R[r][c + 1]) focusEl(R[r][c + 1]); }
  else if (k === 'ArrowUp') { const up = R.slice(0, r).reverse().find(x => x.length); if (up) focusEl(up[Math.min(c, up.length - 1)] || up[0]); }
  else if (k === 'ArrowDown') { const dn = R.slice(r + 1).find(x => x.length); if (dn) focusEl(dn[r === 1 ? Math.min(1, dn.length - 1) : Math.min(c, dn.length - 1)]); else hideUI(); }
  else if (k === 'Enter' || k === ' ') { if (cur === $('seek')) toggle(); else cur.click(); }
  else return false;
  e.preventDefault(); return true;
}
document.addEventListener('keydown', onKey);

// ---------- démarrage ----------
S.fit = 'fit';
render(); showUI();
if (!URL_ && MODE === 'web') fail(); else { A.init(); osSearch(); }
if (MODE === 'native') { document.body.classList.add('nav'); }
window.addEventListener('message', e => { if (e.data && e.data.maxi === 'close') A.close(); });
</script>
