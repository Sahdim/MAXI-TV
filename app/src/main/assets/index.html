<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; media-src * data: blob:; connect-src *; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; worker-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=1920">
<title>MAXI tv</title>
<style>
  /* ====== THÈME : modifie ces couleurs pour changer l'interface ====== */
  :root { --bg:#050505; --surface:#101012; --surface2:#19191c; --line:rgba(255,255,255,.08);
          --text:#f5f5f5; --muted:rgba(255,255,255,.6); --accent:#ffffff; --accent2:#aeb2ba; --pad:64px;
          --ease:cubic-bezier(.2,.8,.2,1); --glass:rgba(24,24,27,.62); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); height:100vh; overflow:hidden; user-select:none;
         font-family:'SF Pro Display','Segoe UI Variable Display','Segoe UI',system-ui,sans-serif; letter-spacing:-.01em; }
  button, input { font:inherit; color:inherit; }
  button { cursor:pointer; }
  input { background:rgba(255,255,255,.08); border:1px solid var(--line); border-radius:14px; padding:13px 16px; width:100%; outline:none; transition:background .2s, border-color .2s, box-shadow .2s; user-select:text; }
  input::placeholder { color:var(--muted); }
  input:focus { background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.45); box-shadow:0 0 0 4px rgba(255,255,255,.08); }
  .glass { background:var(--glass); backdrop-filter:blur(30px) saturate(1.8); -webkit-backdrop-filter:blur(30px) saturate(1.8); border:1px solid rgba(255,255,255,.1); }
  .pill { border:0; border-radius:999px; padding:13px 26px; font-weight:600; font-size:16px; display:inline-flex; align-items:center; gap:8px; transition:transform .2s var(--ease), background .2s, opacity .2s; }
  .pill:hover { transform:scale(1.05); } .pill:active { transform:scale(.97); }
  .pill.w { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#0a0a0a; box-shadow:0 8px 26px rgba(255,255,255,.14); }
  .pill.g { background:rgba(255,255,255,.2); backdrop-filter:blur(20px); color:#fff; } .pill.g:hover { background:rgba(255,255,255,.3); }

  /* --- connexion --- */
  #login { position:absolute; top:0; right:0; bottom:0; left:0; display:flex; align-items:center; justify-content:center; background:radial-gradient(ellipse at 50% -10%, #1d1d21 0%, #0c0c0e 36%, var(--bg) 72%); }
  #login .box { width:400px; display:flex; flex-direction:column; gap:12px; padding:36px; border-radius:28px; animation:rise .6s var(--ease); }
  #login h1 { margin:0 0 10px; font-size:30px; font-weight:700; letter-spacing:-.03em; }
  .err { color:#ff8a8a; font-size:14px; min-height:18px; }

  /* --- barre du haut --- */
  #app { display:none; position:absolute; top:0; right:0; bottom:0; left:0; }
  #hdr { position:fixed; top:0; left:0; right:0; z-index:50; height:92px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:0 36px;
         pointer-events:none; background:linear-gradient(rgba(0,0,0,.7), transparent); }
  #hdr > * { pointer-events:auto; }
  .brand { display:flex; align-items:center; gap:12px; font-weight:800; font-size:20px; letter-spacing:-.01em; cursor:pointer; width:max-content; }
  .brand .bl { height:72px; width:auto; display:block; filter:drop-shadow(0 6px 16px rgba(0,0,0,.45)); transition:transform .3s var(--ease); }
  .brand:hover .bl { transform:scale(1.05); }
  .brand .bt { font-style:italic; }
  .brand .bt small { font-weight:300; font-size:12px; letter-spacing:.22em; margin-left:6px; opacity:.75; text-transform:uppercase; }
  .subtoggle { border:0; background:none; color:var(--muted); font:inherit; font-size:13px; padding:4px; cursor:pointer; align-self:center; } .subtoggle:hover, .subtoggle:focus { color:var(--text); outline:none; }
  .loginlogo { width:176px; height:176px; border-radius:42px; margin:0 auto 10px; display:block; box-shadow:0 16px 40px rgba(0,0,0,.55); }
  #login h1 { text-align:center; font-style:italic; }
  #login h1 .tvsmall { font-weight:300; font-size:.5em; letter-spacing:.22em; margin-left:6px; opacity:.75; text-transform:uppercase; }
  #nav { display:flex; gap:2px; padding:5px; border-radius:999px; }
  .nb { background:none; border:0; padding:9px 20px; border-radius:999px; font-size:15px; font-weight:500; color:var(--muted); transition:background .2s, color .2s; }
  .nb:hover { color:#fff; background:rgba(255,255,255,.08); }
  .nb.on { background:rgba(255,255,255,.18); color:#fff; }
  .nb .ni { display:none; }
  /* défilement : l'encoche des onglets glisse sur le côté gauche (icônes seules) */
  #hdr { transition:background .3s; }
  #hdr.side { background:none; }
  #hdr.side .brand, #hdr.side .hr { visibility:hidden; opacity:0; }
  #hdr .brand, #hdr .hr { transition:opacity .25s; }
  #hdr.side #nav { position:fixed; left:8px; top:50%; transform:translateY(-50%); flex-direction:column; gap:4px; padding:5px; border-radius:26px; animation:navSide .35s var(--ease); }
  #hdr.side .nb { display:flex; align-items:center; justify-content:center; min-width:40px; height:40px; padding:0 9px; }
  #hdr.side .nb .ni { display:block; flex:none; }
  #hdr.side .nb .nl { display:none; }
  #hdr.side .nb:hover .nl, #hdr.side .nb:focus .nl { display:inline; margin-left:8px; font-size:14px; white-space:nowrap; }
  #hdr.side .nbadge { position:absolute; margin:0; transform:translate(14px,-14px); min-width:16px; padding:0 4px; font-size:10px; line-height:15px; }
  #hdr.side .nb { position:relative; }
  @keyframes navSide { from { opacity:0; transform:translate(-18px,-50%); } to { opacity:1; transform:translate(0,-50%); } }
  .hr { justify-self:end; display:flex; gap:10px; align-items:center; }
  #q { width:210px; border-radius:999px; padding:10px 18px; font-size:14px; background:var(--glass); backdrop-filter:blur(30px); transition:width .35s var(--ease), background .2s; }
  #q:focus { width:300px; }
  .ghost { border:1px solid rgba(255,255,255,.18); background:var(--glass); backdrop-filter:blur(30px); border-radius:999px; padding:9px 16px; font-size:13px; transition:background .2s; }
  .ghost:hover { background:rgba(255,255,255,.2); }

  #view { position:absolute; top:0; right:0; bottom:0; left:0; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; }
  .page { padding-bottom:70px; }
  .page.top { padding-top:112px; }
  .newb { position:absolute; top:8px; left:8px; z-index:3; padding:3px 8px; border-radius:999px; background:#fff; color:#111; font-size:10px; font-weight:800; letter-spacing:.08em; box-shadow:0 2px 8px rgba(0,0,0,.4); pointer-events:none; }
  .nbadge { display:inline-block; min-width:18px; margin-left:8px; padding:1px 6px; border-radius:999px; background:#fff; color:#111; font-size:11px; font-weight:800; line-height:16px; text-align:center; vertical-align:2px; }
  .nb:focus .nbadge { background:#111; color:#fff; }
  .tbar { display:flex; align-items:center; gap:14px; padding:0 var(--pad); margin:8px 0 14px; position:relative; z-index:5; }
  .tbar .upd { display:flex; align-items:center; gap:8px; border:1px solid rgba(255,255,255,.18); background:var(--glass); color:var(--text); border-radius:999px; padding:9px 18px; font-size:14px; font-weight:600; cursor:pointer; }
  .tbar .upd:hover { background:rgba(255,255,255,.18); } .tbar .upd.spin svg { animation:spin 1s linear infinite; }
  .tbar .tinfo { color:var(--muted); font-size:13px; }
  html.tv .tbar .upd:focus { background:#fff; color:#111; box-shadow:0 0 0 4px #fff; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .ptitle { margin:0; padding:0 var(--pad); font-size:46px; font-weight:700; letter-spacing:-.035em; }
  .psub { margin:6px 0 10px; padding:0 var(--pad); color:var(--muted); }
  .back { margin:0 var(--pad) 18px; padding:9px 18px; font-size:14px; border-radius:999px; }

  /* --- grand visuel --- */
  .hero { position:relative; height:min(84vh,780px); min-height:520px; overflow:hidden; background:var(--bg); }
  .slide { position:absolute; top:0; right:0; bottom:0; left:0; opacity:0; transition:opacity 1s ease; }
  .slide.on { opacity:1; }
  .bd { position:absolute; top:0; right:0; bottom:0; left:0; width:100%; height:100%; object-fit:cover; }
  .bd.blur { filter:blur(50px) saturate(1.3) brightness(.55); transform:scale(1.35); }
  .shade { position:absolute; top:0; right:0; bottom:0; left:0; background:linear-gradient(90deg, rgba(5,5,5,.92) 0%, rgba(5,5,5,.5) 40%, transparent 72%), linear-gradient(to top, var(--bg) 3%, transparent 42%); }
  .hc { position:absolute; left:var(--pad); bottom:132px; max-width:640px; animation:rise .9s var(--ease) both; }
  .tag { color:var(--accent2); font-size:13px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; margin-bottom:12px; }
  .hc h1 { margin:0 0 12px; font-size:clamp(38px,5.4vw,72px); line-height:1.02; font-weight:700; letter-spacing:-.04em; text-shadow:0 4px 30px rgba(0,0,0,.4); }
  .meta { color:rgba(255,255,255,.75); font-size:15px; margin-bottom:14px; }
  .plot { color:rgba(255,255,255,.82); font-size:16px; line-height:1.5; margin:0 0 24px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .hp { position:absolute; right:calc(var(--pad) + 40px); top:50%; width:250px; transform:translateY(-44%); }
  .dots { position:absolute; right:var(--pad); bottom:110px; display:flex; gap:8px; z-index:3; }
  .dots i { width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.3); transition:all .3s var(--ease); cursor:pointer; }
  .dots i.on { width:24px; border-radius:4px; background:linear-gradient(90deg,var(--accent),var(--accent2)); }
  .home { position:relative; z-index:2; margin-top:-76px; }

  /* --- rangées --- */
  .shelf { margin-bottom:6px; }
  .sh { display:flex; align-items:baseline; gap:14px; padding:0 var(--pad); }
  .sh h2 { margin:0; font-size:22px; font-weight:650; letter-spacing:-.02em; }
  .all { background:none; border:0; color:var(--muted); font-size:14px; transition:color .2s; }
  .all:hover { color:#fff; }
  .rw { position:relative; }
  .rail { display:flex; gap:20px; overflow-x:auto; overflow-y:hidden; padding:22px var(--pad) 36px; scroll-padding-left:var(--pad); scroll-snap-type:x proximity; scrollbar-width:none; }
  .rail::-webkit-scrollbar { display:none; }
  .arr { position:absolute; top:34%; z-index:4; width:46px; height:46px; border-radius:50%; border:1px solid rgba(255,255,255,.14); background:var(--glass); backdrop-filter:blur(20px);
         font-size:24px; line-height:1; opacity:0; transition:opacity .25s, transform .2s var(--ease); }
  .arr.l { left:12px; } .arr.r { right:12px; }
  .rw:hover .arr { opacity:1; } .arr:hover { transform:scale(1.1); }
  .sk .skrail { height:250px; margin:22px var(--pad) 36px; border-radius:16px; background:linear-gradient(90deg,#0d0d0f,#17171a,#0d0d0f); background-size:200% 100%; animation:shim 1.5s linear infinite; }

  /* --- cartes avec effet 3D --- */
  .card { flex:none; width:176px; scroll-snap-align:start; position:relative; outline:none; }
  .card.live { width:268px; }
  .card:hover { z-index:5; }
  .art { position:relative; aspect-ratio:2/3; border-radius:16px; overflow:hidden; background:var(--surface); cursor:pointer;
         box-shadow:0 0 0 1px var(--line), 0 8px 20px rgba(0,0,0,.35);
         transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)); transition:transform .45s var(--ease), box-shadow .4s; }
  .card.live .art { aspect-ratio:16/9; background:linear-gradient(150deg,#1b1b1f,#0a0a0c); }
  .card:hover .art, .card:focus-visible .art { transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(1.08); transition:transform .12s ease-out, box-shadow .4s;
         box-shadow:0 0 0 1px rgba(255,255,255,.3), 0 30px 60px rgba(0,0,0,.65); }
  .art img { width:100%; height:100%; object-fit:cover; display:block; }
  .card.live .art img { object-fit:contain; padding:20px; }
  .art .ph { position:absolute; top:0; right:0; bottom:0; left:0; display:flex; align-items:center; justify-content:center; font-size:44px; font-weight:700; color:rgba(255,255,255,.22); background:linear-gradient(160deg,var(--surface2),var(--surface)); }
  .gloss { position:absolute; top:0; right:0; bottom:0; left:0; pointer-events:none; opacity:0; transition:opacity .3s; background:radial-gradient(circle at var(--mx,50%) var(--my,30%), rgba(255,255,255,.3), transparent 55%); }
  .card:hover .gloss { opacity:1; }
  .cap { margin-top:12px; font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:color .2s; }
  .card:hover .cap { color:#fff; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(176px,1fr)); gap:28px 22px; padding:22px var(--pad) 30px; }
  .grid.live { grid-template-columns:repeat(auto-fill, minmax(268px,1fr)); }
  .grid .card, .grid .card.live { width:auto; }
  .sentinel { height:1px; }

  /* --- fiche détaillée --- */
  #cats { position:fixed; top:0; bottom:0; left:0; width:min(380px,86vw); z-index:75; transform:translateX(-104%); transition:transform .35s var(--ease); background:rgba(14,14,17,.92); backdrop-filter:blur(30px); border-right:1px solid rgba(255,255,255,.1); display:flex; flex-direction:column; padding:26px 0 18px; }
  #cats.open { transform:none; box-shadow:30px 0 80px rgba(0,0,0,.55); }
  #catsx { position:fixed; top:0; right:0; bottom:0; left:0; z-index:74; background:rgba(0,0,0,.45); opacity:0; pointer-events:none; transition:opacity .3s; }
  #catsx.open { opacity:1; pointer-events:auto; }
  #cats h3 { margin:0 26px 14px; font-size:22px; letter-spacing:-.02em; } #cats h3 small { display:block; margin-top:3px; font-size:13px; font-weight:500; color:var(--muted); letter-spacing:0; }
  #cats .cl { flex:1; overflow-y:auto; padding:2px 14px 10px; overscroll-behavior:contain; }
  #cats .ci { display:block; width:100%; text-align:left; border:0; background:transparent; color:var(--text); font:inherit; font-size:16px; font-weight:500; padding:12px 16px; border-radius:12px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:background .15s, transform .15s; }
  #cats .ci:hover, #cats .ci:focus { background:rgba(255,255,255,.14); outline:none; }
  #cats .ci:focus { background:rgba(255,255,255,.92); color:#0a0a0a; transform:scale(1.02); }
  #cats .ci.sp { font-weight:700; } #cats .ci.sp + .ci:not(.sp) { margin-top:10px; }
  #cats .ci.cur { box-shadow:inset 3px 0 0 var(--accent); font-weight:700; }
  .tbar .upd.cb svg { opacity:.9; }
  #trl { position:fixed; top:0; right:0; bottom:0; left:0; z-index:90; background:#000; display:none; align-items:center; justify-content:center; }
  #trl.open { display:flex; } #trl iframe, #trl video { width:100%; height:100%; border:0; background:#000; }
  #trl .x { position:absolute; top:22px; left:26px; z-index:2; }
  .dbtns { display:flex; gap:12px; flex-wrap:wrap; margin-top:8px; align-items:center; }
  #detail { position:fixed; top:0; right:0; bottom:0; left:0; z-index:60; display:none; overflow-y:auto; background:var(--bg); }
  #detail.open { display:block; animation:pop .4s var(--ease); }
  .dbg { position:fixed; top:0; right:0; bottom:0; left:0; }
  .dshade { position:fixed; top:0; right:0; bottom:0; left:0; background:linear-gradient(90deg, rgba(5,5,5,.95) 0%, rgba(5,5,5,.7) 50%, rgba(5,5,5,.35) 100%), linear-gradient(to top, var(--bg), transparent 50%); }
  .dclose { position:fixed; top:26px; right:32px; z-index:5; width:46px; height:46px; border-radius:50%; font-size:20px; }
  .dwrap { position:relative; z-index:2; max-width:1180px; margin:0 auto; padding:110px 48px 80px; display:grid; grid-template-columns:260px 1fr; gap:56px; align-items:start; }
  .dwrap .card { width:260px; pointer-events:auto; }
  .dwrap h1 { margin:0 0 12px; font-size:clamp(34px,4.4vw,58px); line-height:1.05; font-weight:700; letter-spacing:-.04em; }
  .dwrap .plot { -webkit-line-clamp:6; max-width:680px; }
  .pills { display:flex; gap:8px; flex-wrap:wrap; margin:26px 0 18px; }
  .sp { border:0; border-radius:999px; padding:8px 18px; font-size:14px; font-weight:500; background:rgba(255,255,255,.1); color:var(--muted); transition:background .2s, color .2s; }
  .sp:hover { background:rgba(255,255,255,.16); color:#fff; } .sp.on { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#0a0a0a; }
  .eps { display:flex; flex-direction:column; gap:8px; max-width:760px; }
  .ep { display:flex; align-items:center; gap:16px; padding:10px 14px; border-radius:14px; cursor:pointer; background:rgba(255,255,255,.05); transition:background .2s, transform .2s var(--ease); }
  .ep:hover { background:rgba(255,255,255,.12); transform:translateX(4px); }
  .ep img { width:128px; height:72px; object-fit:cover; border-radius:10px; background:var(--surface2); flex:none; }
  .ep .n { width:28px; color:var(--muted); text-align:center; flex:none; font-variant-numeric:tabular-nums; }
  .ep .tt { flex:1; min-width:0; } .ep .tt b { display:block; font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ep .tt small { color:var(--muted); font-size:12px; }
  .ep .pl { opacity:0; transition:opacity .2s; font-size:18px; } .ep:hover .pl { opacity:1; }

  /* --- lecteur --- */
  #pl { position:fixed; top:0; right:0; bottom:0; left:0; z-index:100; background:#000; display:none; }
  #pl.open { display:block; animation:pop .3s var(--ease); }
  #pl iframe { width:100%; height:100%; border:0; background:#000; display:block; }
  .ptop { position:absolute; top:0; left:0; right:0; padding:24px 30px; display:flex; align-items:center; gap:16px; background:linear-gradient(rgba(0,0,0,.7), transparent);
          opacity:0; transition:opacity .35s; pointer-events:none; }
  #pl.active .ptop { opacity:1; } #pl.active .ptop > * { pointer-events:auto; }
  #pl:not(.active) { cursor:none; }
  .ptop button { width:44px; height:44px; border-radius:50%; font-size:18px; flex:none; }
  .ptop span { font-size:18px; font-weight:600; text-shadow:0 2px 10px rgba(0,0,0,.6); }


  /* --- chaînes : logo plein cadre + aperçu en direct --- */
  .card.live .cap { display:none; }
  .card.live .art .lfg { position:absolute; top:0; right:0; bottom:0; left:0; width:100%; height:100%; object-fit:contain; padding:15% 22% 27%; filter:drop-shadow(0 4px 10px rgba(0,0,0,.35)); transition:opacity .5s, transform .6s var(--ease); }
  .card.live:hover .art .lfg { transform:scale(1.06); }
  .lph { position:absolute; top:0; right:0; bottom:0; left:0; display:flex; align-items:center; justify-content:center; padding-bottom:14px; font-size:42px; font-weight:700; letter-spacing:-.03em; color:rgba(255,255,255,.5); }
  .lshade { position:absolute; top:0; right:0; bottom:0; left:0; pointer-events:none; background:linear-gradient(to top, rgba(0,0,0,.6) 0%, transparent 42%); }
  .lname { position:absolute; left:15px; right:56px; bottom:12px; z-index:3; font-size:13.5px; font-weight:600; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,.6); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lcta { position:absolute; right:12px; bottom:9px; z-index:3; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; padding-left:2px;
          background:rgba(255,255,255,.22); backdrop-filter:blur(14px); opacity:0; transform:scale(.8); transition:opacity .3s, transform .3s var(--ease); }
  .card.live:hover .lcta { opacity:1; transform:none; }
  .lv { position:absolute; top:0; right:0; bottom:0; left:0; width:100%; height:100%; object-fit:cover; background:#000; opacity:0; transition:opacity .6s; }
  .art.live-on .lv { opacity:1; }
  .art.live-on .lfg, .art.live-on .lph { opacity:0; }
  .lbadge { position:absolute; top:11px; left:12px; z-index:3; display:flex; align-items:center; gap:6px; padding:4px 10px 4px 8px; border-radius:999px; font-size:10.5px; font-weight:700; letter-spacing:.1em;
            background:rgba(0,0,0,.5); backdrop-filter:blur(10px); opacity:0; transform:translateY(-4px); transition:opacity .4s, transform .4s var(--ease); }
  .lbadge::before { content:''; width:6px; height:6px; border-radius:50%; background:#ff3b30; animation:blink 1.2s ease-in-out infinite; }
  .art.live-on .lbadge { opacity:1; transform:none; }
  @keyframes blink { 50% { opacity:.3; } }


  /* --- aperçus vidéo (bande-annonce) --- */
  .pvv { position:absolute; top:0; right:0; bottom:0; left:0; width:100%; height:100%; object-fit:cover; background:#000; opacity:0; transition:opacity .8s; }
  .pvv.on { opacity:1; }
  .ytf { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); border:0; pointer-events:none; opacity:0; transition:opacity .9s; background:#000; }
  .ytf.on { opacity:1; }
  .art.live-on .lcta { opacity:0 !important; }
  .sbtn { position:absolute; right:var(--pad); bottom:150px; z-index:6; width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; padding:0; color:#fff;
          opacity:0; pointer-events:none; transform:scale(.9); transition:opacity .4s, transform .3s var(--ease), background .2s; }
  .sbtn.on { opacity:1; pointer-events:auto; transform:none; }
  .sbtn:hover { transform:scale(1.08); background:rgba(255,255,255,.22); }
  .hero.short { height:min(68vh,640px); min-height:440px; }





  /* --- intro : particules qui dessinent le logo --- */
  #intro { position:fixed; top:0; right:0; bottom:0; left:0; z-index:300; cursor:pointer; background:#000; will-change:opacity; transition:opacity .7s ease, visibility .7s; }
  #intro.out { opacity:0; visibility:hidden; }
  #intro canvas { position:absolute; top:0; right:0; bottom:0; left:0; width:100%; height:100%; display:block; z-index:1; }
  #intro .ibg { position:absolute; top:0; right:0; bottom:0; left:0; background:radial-gradient(ellipse at 50% 42%, #23252d 0%, #050507 78%); opacity:.3; will-change:opacity; }
  #intro .veil { position:absolute; top:0; right:0; bottom:0; left:0; background:#000; opacity:1; z-index:2; pointer-events:none; will-change:opacity; }


  /* --- Fire TV / Android TV : navigation à la télécommande --- */
  html.tv { zoom:var(--tvz,1.35); }
  html.tv body { height:calc(100vh / var(--tvz,1.35)); }
  html.tv, html.tv body, html.tv * { cursor:none !important; }
  html.tv :focus { outline:none; }
  html.tv .arr, html.tv .gloss { display:none !important; }
  html.tv .sk .skrail { animation:none; background:#111113; }
  html.tv .lbadge::before { animation:none; }
  html.tv .card { contain:layout style; }
  html.tv .card.live .art .lfg { filter:none; transition:opacity .3s; }
  html.tv .card.live:hover .art .lfg { transform:none; }
  html.tv .rail .card.live { content-visibility:auto; contain-intrinsic-size:auto 268px auto 151px; }
  html.tv .lshade, html.tv .card .cap { will-change:auto; }
  html.tv .shelf { content-visibility:auto; contain-intrinsic-size:auto 330px; }
  html.tv .rail { scroll-snap-type:none; }
  html.tv .glass, html.tv #q, html.tv .ghost, html.tv .sbtn, html.tv .pill.g, html.tv #login .box, html.tv #hdr, html.tv #nav { backdrop-filter:none !important; -webkit-backdrop-filter:none !important; }
  html.tv .glass, html.tv #nav { background:rgba(34,34,40,.94); }
  html.tv #login .box { background:rgba(20,20,24,.96); }
  html.tv .bd.blur { filter:blur(22px) saturate(1.2) brightness(.55); transform:scale(1.2); }
  html.tv .art { transform:none !important; }
  html.tv .card:focus { z-index:6; }
  html.tv .card:focus .art { transform:scale(1.1) !important; box-shadow:0 0 0 4px #fff, 0 24px 56px rgba(0,0,0,.7); transition:transform .18s ease-out, box-shadow .18s; }
  html.tv .nb:focus { background:#fff; color:#111; }
  html.tv .pill:focus { box-shadow:0 0 0 4px #fff, 0 10px 30px rgba(0,0,0,.5); transform:scale(1.07); }
  html.tv .ghost:focus, html.tv .sp:focus, html.tv .all:focus, html.tv .back:focus, html.tv .dclose:focus, html.tv .sbtn:focus { box-shadow:0 0 0 4px #fff; color:#fff; background:rgba(255,255,255,.24); }
  html.tv .ep:focus { background:rgba(255,255,255,.2); box-shadow:0 0 0 3px #fff; transform:translateX(6px); }
  html.tv .brand:focus .bl { transform:scale(1.08); }
  html.tv input:focus { box-shadow:0 0 0 4px #fff; border-color:#fff; }


  /* anciens moteurs web (Fire OS 6) : « aspect-ratio » n'existe pas, on garde les proportions des affiches autrement */
  @supports not (aspect-ratio: 1 / 1) {
    .art { height:0; padding-top:150%; } .card.live .art { padding-top:56.25%; }
    .art > img, .art > .ph, .art > .pvv, .art > .lfg, .art > .lph, .art > .lshade, .art > .gloss { position:absolute; top:0; left:0; width:100%; height:100%; }
  }

  ::-webkit-scrollbar { width:10px; } ::-webkit-scrollbar-thumb { background:#2a2a2e; border-radius:6px; border:2px solid var(--bg); }
  @keyframes rise { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
  @keyframes pop { from { opacity:0; transform:scale(.985); } to { opacity:1; transform:none; } }
  @keyframes shim { to { background-position:-200% 0; } }
</style>
</head>

// films et séries : extrait muet du contenu (le fournisseur n'envoie pas de bande-annonce)
function sampleSource(t, it, info) {

  if (t === 'movies') {
    const ext = info.ext || it.container_extension || 'mp4', u = `${base}/movie/${enc(user)}/${enc(pass)}/${it.stream_id}`;
    return direct(ext) ? { url: u + '.' + ext } : { url: u + '.m3u8', hls: true };
  }
  const eps = info.episodes || {};
  const keys = Array.isArray(eps) ? eps.map((_, i) => i) : Object.keys(eps).sort((a, b) => a - b);
  for (const k of keys) {
    const ep = asArr(eps[k])[0];
    if (ep && ep.id) {
      const u = `${base}/series/${enc(user)}/${enc(pass)}/${ep.id}`, ext = ep.container_extension || 'mp4';
      return direct(ext) ? { url: u + '.' + ext } : { url: u + '.m3u8', hls: true };

}

async function startSample(t, it, parent, before, opts) {
  const info = await infoFor(t, it);
  if (!opts.alive()) return null;
  const src = sampleSource(t, it, info); if (!src) return null;
  const v = document.createElement('video'); v.className = 'pvv'; v.muted = !SOUND; v.defaultMuted = !SOUND; v.playsInline = true;
  parent.insertBefore(v, before);
  let hl = null, done = false, tm;
  const handle = { stop() {
    if (done) return; done = true; clearTimeout(tm);
    v.classList.remove('on');
    if (hl) hl.destroy(); v.pause(); v.removeAttribute('src'); v.load();
    setTimeout(() => v.remove(), 900);
  } };
  const seek = d => { if (isFinite(d) && d > 180) { try { v.currentTime = Math.min(d * .2, 600); } catch (e) {} } };  // saute le générique
  if (src.hls) {
    if (!hlsOK()) { handle.stop(); return null; }
    hl = new Hls({ maxBufferLength: 8, capLevelToPlayerSize: true });
    hl.loadSource(src.url); hl.attachMedia(v);
    hl.once(Hls.Events.LEVEL_LOADED, (e, d) => seek(d.details.totalduration));
    hl.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(() => {}));
    hl.on(Hls.Events.ERROR, (e, d) => { if (d.fatal) handle.stop(); });
  } else {
    v.addEventListener('loadedmetadata', () => seek(v.duration), { once: true });
    v.addEventListener('error', () => handle.stop(), { once: true });
    v.src = src.url; v.play().catch(() => {});
  }
  v.addEventListener('playing', () => setTimeout(() => { if (!done) v.classList.add('on'); }, 250), { once: true });
  tm = setTimeout(() => handle.stop(), opts.ms || 9000);
  return handle;
}


// ---------- vraies bandes-annonces (YouTube) ----------
function ytId(v) {
  if (!v) return '';
  v = String(v).trim();
  const m = v.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);
  if (m) return m[1];
  return /^[\w-]{11}$/.test(v) ? v : '';
}

async function tmdb(path) {
  const bearer = TMDB.length > 40;
  const url = `https://api.themoviedb.org/3${path}${bearer ? '' : (path.includes('?') ? '&' : '?') + 'api_key=' + TMDB}`;
  const r = await fetch(url, bearer ? { headers: { Authorization: 'Bearer ' + TMDB } } : undefined);
  return r.json();
}

const OFFICIAL_OK = /(bande[\s-]?annonce|trailer|teaser)/i;
const OFFICIAL_NO = /(spoil|ending|expliqu|explained|sc[eè]ne|scene|clip|extrait|featurette|making|coulisses|behind|interview|r[ée]action|review|critique|recap|r[ée]sum[ée]|fan[\s-]?made|compilation|soundtrack|bloopers|gag reel|b[êe]tisier|full movie|film complet|streaming)/i;
const ytMeta = id => cached('yt:' + id, async () => {
  const r = await fetch('https://www.youtube.com/oembed?format=json&url=' + enc('https://www.youtube.com/watch?v=' + id));
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
});
// vérifie le titre de la vidéo YouTube : doit être une bande-annonce, pas un extrait, une critique, une scène…
async function looksOfficial(id) {
  try {
    const m = await ytMeta(id), ok = OFFICIAL_OK.test(m.title) && !OFFICIAL_NO.test(m.title);
    console.log('[bande-annonce] titre YouTube :', m.title, ok ? '✓ accepté' : '✗ refusé');
    return ok;
  } catch (e) { console.log('[bande-annonce] titre non vérifiable → refusée'); return false; }
}

async function tmdbTrailer(t, it) {
  const out = { official: '', any: '' };
  if (!TMDB) return out;
  const raw = nameOf(it), ym = raw.match(/(?:19|20)\d{2}/), year = String(it.year || (ym ? ym[0] : '')).slice(0, 4);
  const title = raw.replace(/^\s*[\[(]?[A-Za-z]{2,3}[\])]?\s*(?:[|:]|\s[-–]\s)\s*/, '').replace(/[\[(][^\])]*[\])]/g, ' ')
    .replace(/\b(MULTI|VOSTFR|VF|VO|FHD|UHD|HD|4K|1080p|720p)\b/gi, ' ').replace(/\s+/g, ' ').trim();
  const kind = t === 'movies' ? 'movie' : 'tv';
  const search = async y => tmdb(`/search/${kind}?language=fr-FR&query=${enc(title)}${y ? (kind === 'movie' ? '&year=' : '&first_air_date_year=') + y : ''}`);
  let r = await search(year);
  if (r.success === false) console.log('[TMDB] refusé :', r.status_message);
  if (!asArr(r.results).length && year) r = await search('');
  const hit = asArr(r.results)[0]; if (!hit) return out;
  for (const lang of ['fr-FR', 'en-US']) {
    const vids = asArr((await tmdb(`/${kind}/${hit.id}/videos?language=${lang}`)).results).filter(x => x.site === 'YouTube');
    const trailers = vids.filter(x => x.type === 'Trailer');
    const off = trailers.find(x => x.official);
    if (off) { out.official = off.key; return out; }          // bande-annonce marquée « officielle » par TMDB
    if (!out.any) { const a = trailers[0] || vids.find(x => x.type === 'Teaser'); if (a) out.any = a.key; }
  }
  return out;
}

// ---------- bande-annonce officielle via Apple iTunes (gratuit, sans clé) ----------
const norm = x => String(x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, ' ').trim();
const cleanTitle = raw => raw.replace(/^\s*[\[(]?[A-Za-z]{2,3}[\])]?\s*(?:[|:]|\s[-–]\s)\s*/, '').replace(/[\[(][^\])]*[\])]/g, ' ')
  .replace(/\b(MULTI|VOSTFR|VF|VO|FHD|UHD|HD|4K|1080p|720p)\b/gi, ' ').replace(/\s+/g, ' ').trim();

async function itunesTrailer(t, it) {
  const raw = nameOf(it), title = cleanTitle(raw), want = norm(title);
  const ym = raw.match(/(?:19|20)\d{2}/), year = Number(String(it.year || (ym ? ym[0] : '')).slice(0, 4)) || 0;
  if (!want) return '';
  const kind = t === 'movies' ? 'media=movie&entity=movie' : 'media=tvShow&entity=tvSeason';
  for (const cc of ['fr', 'us']) {
    const r = await (await fetch(`https://itunes.apple.com/search?term=${enc(title)}&${kind}&country=${cc}&limit=12`)).json();
    let best = '', bestSeason = 1e9;
    for (const x of asArr(r.results)) {
      if (!x.previewUrl) continue;
      if (norm(t === 'movies' ? x.trackName : x.artistName) !== want) continue;        // le titre doit correspondre exactement
      if (t === 'movies') {
        const y = Number(String(x.releaseDate || '').slice(0, 4));
        if (year && y && Math.abs(y - year) > 1) continue;                               // et l'année aussi
        return x.previewUrl;
      }
      const sm = (x.collectionName || '').match(/(?:Season|Saison)\s+(\d+)/i), n = sm ? Number(sm[1]) : 1e8;
      if (n < bestSeason) { best = x.previewUrl; bestSeason = n; }                       // série : bande-annonce de la saison 1
    }
    if (best) return best;
  }
  return '';
}

// ordre : 1) officielle TMDB (si clé)  2) Apple iTunes  3) lien du fournisseur (titre vérifié)  4) autre bande-annonce TMDB (titre vérifié)
function trailerFor(t, it, info) {
  return cached('tr:' + t + (it.stream_id || it.series_id), async () => {
    let tm = { official: '', any: '' };
    try { tm = await tmdbTrailer(t, it); } catch (e) { console.log('[TMDB] erreur', e.message); }
    if (tm.official) return { kind: 'yt', id: tm.official };
    try { const u = await itunesTrailer(t, it); if (u) return { kind: 'file', url: u }; } catch (e) { console.log('[iTunes] erreur', e.message); }
    if (info.trailer && await looksOfficial(info.trailer)) return { kind: 'yt', id: info.trailer };
    if (tm.any && await looksOfficial(tm.any)) return { kind: 'yt', id: tm.any };
    return null;
  });
}

// lecture d'un fichier vidéo direct (bande-annonce iTunes)
function startFile(url, parent, before, opts) {
  const v = document.createElement('video'); v.className = 'pvv'; v.muted = !soundOn; v.defaultMuted = !soundOn; v.playsInline = true; v.volume = .7;
  parent.insertBefore(v, before);
  let done = false, tm, failT;
  const handle = { setMuted(m) { v.muted = m; if (!m) v.volume = .7; }, stop() {
    if (done) return; done = true; clearTimeout(tm); clearTimeout(failT);
    v.classList.remove('on'); v.pause(); v.removeAttribute('src'); v.load(); setTimeout(() => v.remove(), 900);
    if (opts.onEnd) opts.onEnd();
  } };
  const fail = () => { if (done) return; handle.stop(); if (opts.onFail) opts.onFail(); };
  v.addEventListener('error', fail, { once: true });
  v.addEventListener('playing', () => {
    clearTimeout(failT);
    if (!done) { v.classList.add('on'); if (opts.onPlay) opts.onPlay(); tm = setTimeout(() => handle.stop(), opts.ms || 12000); }
  }, { once: true });
  failT = setTimeout(() => { console.log('[bande-annonce] le fichier n’a pas démarré en 7 s'); fail(); }, 7000);
  v.src = url;
  v.play().catch(() => {   // son refusé par le navigateur : on démarre sans le son, le bouton permet de l'activer
    if (!v.muted) { v.muted = true; soundOn = false; updateSoundBtn(); v.play().catch(() => {}); }
  });
  return handle;
}

async function startTrailer(t, it, parent, before, opts) {
  const info = await infoFor(t, it);
  if (!opts.alive()) return null;
  const tr = await trailerFor(t, it, info);
  console.log('[bande-annonce]', nameOf(it), '→', tr ? (tr.kind === 'file' ? 'iTunes ' + tr.url : 'YouTube ' + tr.id) : 'aucune bande-annonce officielle trouvée');
  if (!tr || !opts.alive()) return null;
  if (tr.kind === 'file') return startFile(tr.url, parent, before, opts);
  const id = tr.id;
  const f = document.createElement('iframe'); f.className = 'ytf'; f.allow = 'autoplay; encrypted-media'; f.tabIndex = -1;
  f.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=${soundOn ? 0 : 1}&controls=0&disablekb=1&fs=0&iv_load_policy=3&modestbranding=1&rel=0&playsinline=1&enablejsapi=1&origin=${enc(location.origin)}`;
  parent.insertBefore(f, before);
  const W = parent.clientWidth || 800, H = parent.clientHeight || 450, w = Math.max(W, H * 16 / 9) * 1.32;
  f.style.width = w + 'px'; f.style.height = (w * 9 / 16) + 'px';
  let done = false, playing = false, tm, failT;
  const cmd = (func, args) => { try { f.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args: args || [] }), '*'); } catch (e) {} };
  const onMsg = e => {
    if (e.source !== f.contentWindow) return;
    let d; try { d = JSON.parse(e.data); } catch (_) { return; }
    if (d.event === 'onError') { console.log('[bande-annonce] erreur YouTube, code', d.info, '(101/150/153 = lecture refusée)'); return fail(); }
    if (d.event === 'onReady') { cmd(soundOn ? 'unMute' : 'mute'); if (soundOn) cmd('setVolume', [70]); cmd('playVideo'); }
    const st = d.event === 'onStateChange' ? d.info : (d.event === 'infoDelivery' && d.info ? d.info.playerState : null);
    if (st === 1 && !playing && !done) {
      playing = true; clearTimeout(failT); f.classList.add('on'); if (opts.onPlay) opts.onPlay();
      tm = setTimeout(() => handle.stop(), opts.ms || 12000);   // la bande-annonce dure quelques secondes
    }
  };
  const handle = { setMuted(m) { cmd(m ? 'mute' : 'unMute'); if (!m) cmd('setVolume', [70]); }, stop() {
    if (done) return; done = true; clearTimeout(tm); clearTimeout(failT);
    window.removeEventListener('message', onMsg); f.classList.remove('on'); setTimeout(() => f.remove(), 1000);
    if (opts.onEnd) opts.onEnd();
  } };
  const fail = () => { if (done) return; handle.stop(); if (opts.onFail) opts.onFail(); };
  window.addEventListener('message', onMsg);
  f.addEventListener('load', () => { try { f.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 1, channel: 'widget' }), '*'); } catch (e) {} });
  failT = setTimeout(() => { console.log('[bande-annonce] YouTube n’a pas démarré en 7 s'); fail(); }, 7000);   // si YouTube ne démarre pas, on bascule sur un extrait du film
  return handle;
}

// bande-annonce officielle uniquement (sinon rien, pour ne pas spoiler)
async function startMedia(t, it, parent, before, opts) {
  const comp = { cur: null, dead: false, stop() { this.dead = true; if (this.cur) this.cur.stop(); }, setMuted(m) { if (this.cur && this.cur.setMuted) this.cur.setMuted(m); } };
  const fallback = () => {
    if (!FALLBACK_SAMPLE || comp.dead || !opts.alive()) return;
    startSample(t, it, parent, before, opts).then(s => { if (!s) return; if (comp.dead || !opts.alive()) s.stop(); else comp.cur = s; });
  };
  const th = await startTrailer(t, it, parent, before, { ...opts, onFail: fallback });
  if (th) { comp.cur = th; return comp; }
  return FALLBACK_SAMPLE ? startSample(t, it, parent, before, opts) : null;
}

// ---------- affiches : sources de secours quand celle du fournisseur manque ou est cassée ----------
function titleYear(it) {
  const raw = nameOf(it), ym = raw.match(/(?:19|20)\d{2}/);
  return { title: cleanTitle(raw), year: Number(String(it.year || (ym ? ym[0] : '')).slice(0, 4)) || 0 };
}
async function tmdbPoster(t, it) {
  if (!TMDB) return '';
  const { title, year } = titleYear(it); if (!title) return '';
  const kind = t === 'movies' ? 'movie' : 'tv';
  const q = y => tmdb(`/search/${kind}?language=fr-FR&query=${enc(title)}${y ? (kind === 'movie' ? '&year=' : '&first_air_date_year=') + y : ''}`);
  let r = await q(year); if (!asArr(r.results).filter(x => x.poster_path).length && year) r = await q(0);
  const hit = asArr(r.results).find(x => x.poster_path); return hit ? 'https://image.tmdb.org/t/p/w500' + hit.poster_path : '';
}
async function itunesPoster(t, it) {
  const { title, year } = titleYear(it), want = norm(title); if (!want) return '';
  const kind = t === 'movies' ? 'media=movie&entity=movie' : 'media=tvShow&entity=tvSeason';
  for (const cc of ['fr', 'us']) {
    const r = await (await fetch(`https://itunes.apple.com/search?term=${enc(title)}&${kind}&country=${cc}&limit=10`)).json();
    for (const x of asArr(r.results)) {
      if (!x.artworkUrl100) continue;
      if (norm(t === 'movies' ? x.trackName : x.artistName) !== want) continue;           // même titre exactement
      if (t === 'movies') { const y = Number(String(x.releaseDate || '').slice(0, 4)); if (year && y && Math.abs(y - year) > 1) continue; }
      return x.artworkUrl100.replace(/\/\d+x\d+bb\./, '/400x600bb.');
    }
  }
  return '';
}
let altChain = Promise.resolve();                                                          // une recherche à la fois, pour ne pas saturer les services
function altPoster(t, it) {
  return cached('pp:' + t + (it.stream_id || it.series_id), () => new Promise(res => {
    altChain = altChain.then(async () => {
      let u = ''; try { u = (await tmdbPoster(t, it)) || (await itunesPoster(t, it)); } catch (e) {}
      res(u || ''); await new Promise(r => setTimeout(r, 300));
    });
  }));
}
const pio = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { pio.unobserve(e.target); if (e.target._w) e.target._w(); } }), { root: $('view'), rootMargin: '300px' });

// ---------- cartes & rangées ----------
function makeCard(t, it, opts) {
  opts = opts || {};
  if (t === 'live') { const lc = makeLive(it); const la = lc.querySelector('.art') || lc; tagNew(la, it); return lc; }
  const c = el('div', 'card'); c.tabIndex = 0;
  const art = el('div', 'art'); const u = imgOf(it);
  const ph = () => { if (!art.querySelector('.ph')) art.prepend(el('div', 'ph', (nameOf(it)[0] || '▶').toUpperCase())); };
  const cands = u && window.Native ? [PROXY + '/i?u=' + enc(u)].concat([u]) : (u ? [u].concat(u.startsWith('http:') ? ['https:' + u.slice(5)] : u.startsWith('https:') ? ['http:' + u.slice(6)] : []) : []);   // Fire TV : affiche réduite par le relais (économise la RAM)
  if (cands.length) {                                   // 1) l'adresse du fournisseur, en http puis https  2) une affiche trouvée ailleurs  3) la lettre
    let k = 0, alt = false; const im = mkImg(); im.loading = 'lazy'; im.decoding = 'async'; im.alt = '';
    const next = async () => {
      if (k < cands.length) { im.src = cands[k++]; return; }
      if (!alt) { alt = true; const a = await altPoster(t, it); if (a) { im.src = a; return; } }
      im.remove(); ph();
    };
    im.onerror = next; im.onload = () => { if (im.naturalWidth < 40 || im.naturalHeight < 40) next(); };   // fausse image vide : on passe à la suite
    art.appendChild(im); next();
  } else {                                              // aucune affiche fournie : on en cherche une quand la carte devient visible
    ph();
    art._w = async () => { const a = await altPoster(t, it); if (!a) return; const i2 = mkImg(); i2.alt = ''; i2.onload = () => { const p0 = art.querySelector('.ph'); if (p0) p0.remove(); art.prepend(i2); }; i2.src = a; };
    pio.observe(art);
  }
  art.appendChild(el('div', 'gloss')); tagNew(art, it);
  c.appendChild(art); c.appendChild(el('div', 'cap', nameOf(it)));
  if (opts.nopv) c.tabIndex = -1;
  const act = () => openDetail(t, it);
  c.onclick = act; c.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); act(); } };
  if (!opts.nopv) {   // la bande-annonce ne se joue que dans le grand visuel du haut
    let mode = null;
    const enter = () => { mode = (stage && stage.trailers && heroVisible()) ? 'hero' : null; if (mode === 'hero') stageHover(t, it); };
    const leave = () => { if (mode === 'hero') stageLeave(); mode = null; };
    c.addEventListener('mouseenter', enter); c.addEventListener('mouseleave', leave);
    c.addEventListener('focus', enter); c.addEventListener('blur', leave);          // télécommande : le focus joue le rôle du survol
  }
  return c;
}

// libère les images décodées des étagères/cartes loin de l'écran (RAM), et les recharge quand on s'en approche
const rel = new IntersectionObserver(es => es.forEach(e => {
  const imgs = e.target.tagName === 'IMG' ? [e.target] : e.target.querySelectorAll('.art img');
  if (e.isIntersecting) { for (const i of imgs) if (i._s) { i.src = i._s; i._s = null; } }
  else for (const i of imgs) { const sv = i.getAttribute('src'); if (sv && !i._s) { i._s = sv; i.removeAttribute('src'); } }
}), { root: $('view'), rootMargin: '1100px 0px' });
function makeShelf(title, t, items, onAll) {
  const s = el('section', 'shelf'); const hd = el('div', 'sh'); hd.appendChild(el('h2', '', title));
  if (onAll) { const a = el('button', 'all', 'Voir tout ›'); a.onclick = onAll; hd.appendChild(a); }
  s.appendChild(hd);

  items.slice(0, TV ? 12 : 30).forEach(it => rail.appendChild(makeCard(t, it)));
  const L = el('button', 'arr l', '‹'), R = el('button', 'arr r', '›');

  w.append(L, rail, R); s.appendChild(w);

  if (e.isIntersecting) { io.unobserve(e.target); if (e.target._load) e.target._load(); }

function renderGrid(parent, t, items) {
  const g = el('div', 'grid' + (t === 'live' ? ' live' : '')); parent.appendChild(g);
  const sentinel = el('div', 'sentinel'); parent.appendChild(sentinel);
  let i = 0;
  const so = new IntersectionObserver(es => { if (es[0].isIntersecting) more(); }, { root: $('view'), rootMargin: '900px' });
  function more() {
    const end = Math.min(i + (TV ? 60 : 240), items.length), f = document.createDocumentFragment();
    for (; i < end; i++) { const cd = makeCard(t, items[i]); f.appendChild(cd); if (TV && t !== 'live') rel.observe(cd); }
    g.appendChild(f);
    if (i >= items.length) { so.disconnect(); sentinel.remove(); }
  }
  more(); so.observe(sentinel);
}

// ---------- Fire TV / Android TV : navigation à la télécommande ----------
function tvFocusIn(root) {
  let t = null; for (const q of ['.pill.w', '.sp.on', '.sp', '.ep', 'button:not(.dclose)', 'button']) { t = root.querySelector(q); if (t) break; }
  if (t) t.focus({ preventScroll: true });
}
function tvInitFocus() {
  if (!TV || $('intro') || $('detail').classList.contains('open')) return;
  const a = document.activeElement;
  if (a && a !== document.body && document.contains(a) && a.getBoundingClientRect().width) return;     // déjà quelque chose de sélectionné
  const t = $('login').style.display !== 'none' ? $('host') : (document.querySelector('#view .pill.w') || document.querySelector('#view .card') || document.querySelector('.nb.on') || document.querySelector('.nb'));
  if (t) t.focus({ preventScroll: true });
}
window.tvResume = () => { if (TV) tvInitFocus(); };
window.tvBack = () => {                                           // touche Retour : true = géré par la page, false = on quitte
  if ($('intro')) { $('intro').click(); return true; }
  if (trlOpen()) { closeTrailer(); return true; }
  if (catsOpen()) { closeCats(); return true; }
  if ($('detail').classList.contains('open')) { closeDetail(); return true; }
  if ($('login').style.display !== 'none') return false;
  if (curPage.startsWith('cat:')) { go(curPage.slice(4)); return true; }
  if (curPage !== 'home') { go('home'); return true; }
  return false;
};
if (TV) {
  const SEL = 'button, input, .card, .ep, .brand, [tabindex="0"]';
  $('brand').tabIndex = 0; $('brand').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); go('home'); } };
  const DIR = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const usable = el => {
    if (el.disabled || el.tabIndex < 0) return false; const r = el.getBoundingClientRect(); if (r.width < 4 || r.height < 4) return false;
    const cs = getComputedStyle(el); return cs.visibility !== 'hidden' && cs.display !== 'none' && parseFloat(cs.opacity) > .05;
  };
  function pick(cur, dx, dy) {                                      // navigation spatiale : l'élément le plus proche dans la direction demandée
    const root = trlOpen() ? $('trl') : catsOpen() ? $('cats') : $('detail').classList.contains('open') ? $('detail') : ($('login').style.display !== 'none' ? $('login') : document.body);
    const a = cur.getBoundingClientRect(), ac = { x: a.left + a.width/2, y: a.top + a.height/2 }; let best = null, bs = 1e9;
    for (const el of root.querySelectorAll(SEL)) {
      if (el === cur || !usable(el)) continue;
      const r = el.getBoundingClientRect(), c = { x: r.left + r.width/2, y: r.top + r.height/2 };
      const main = dx > 0 ? r.left - a.right : dx < 0 ? a.left - r.right : dy > 0 ? r.top - a.bottom : a.top - r.bottom;
      const side = dx ? (dx > 0 ? c.x > ac.x : c.x < ac.x) : (dy > 0 ? c.y > ac.y : c.y < ac.y);
      if (!side || main < -12) continue;
      let cross = dx ? Math.abs(c.y - ac.y) : Math.abs(c.x - ac.x);
      const ov = dx ? Math.min(a.bottom, r.bottom) - Math.max(a.top, r.top) : Math.min(a.right, r.right) - Math.max(a.left, r.left);
      if (ov > 0) cross *= .35;                                     // éléments alignés : fortement préférés
      const sc = Math.max(main, 0) + cross*2.2;
      if (sc < bs) { bs = sc; best = el; }
    }
    return best;
  }
  function tvScroll(el) {
    if (el.closest('#cats')) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
    const det = $('detail').classList.contains('open');
    if (det) { el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); return; }
    const v = $('view'), r = el.getBoundingClientRect();

    const cur = document.activeElement; if (!cur || cur === document.body) { tvInitFocus(); e.preventDefault(); return; }
    if (cur.tagName === 'INPUT' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {           // dans un champ texte : flèches gauche/droite = curseur
      const n = cur.value.length, s0 = cur.selectionStart, s1 = cur.selectionEnd;
      if ((e.key === 'ArrowLeft' && s0 > 0) || (e.key === 'ArrowRight' && s1 < n)) return;
    }
    const [dx, dy] = DIR[e.key], nx = pick(cur, dx, dy); e.preventDefault();
    if (nx) { nx.focus({ preventScroll: true }); tvScroll(nx); }
  });
  setInterval(tvInitFocus, 1200);                                    // si plus rien n'est sélectionné, on remet le focus au bon endroit
  // identifiants : fichier config.json de l'appli (évite de taper à la télécommande) + connexion automatique
  try {
    const cfg = window.Native && Native.config ? JSON.parse(Native.config(window.__NT || '') || '{}') : {};
    for (const k of ['host', 'user', 'pass', 'tmdb']) if (cfg[k] && !$(k).value) $(k).value = cfg[k];
    if (cfg.subkey && !$('subk').value) { $('subk').value = cfg.subkey; try { localStorage.setItem('subkey', cfg.subkey); } catch (e) {} }
    if (!sessionStorage.getItem('noauto') && $('host').value && $('user').value && $('pass').value) setTimeout(() => $('go').click(), 500);
  } catch (e) {}
}

// ---------- outil de test : compteur d'images par seconde (ajoute ?fps=1 à l'adresse) ----------
if (/[?&]fps=1\b/.test(location.search)) {
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;left:12px;bottom:12px;z-index:9999;padding:6px 10px;border-radius:8px;background:rgba(0,0,0,.78);color:#9fe8a0;font:13px/1.3 monospace;pointer-events:none';
  document.body.appendChild(box);
  let n = 0, last = performance.now(), prev = last, worst = 0;
  const loop = t => { n++; worst = Math.max(worst, t - prev); prev = t;
    if (t - last >= 1000) { box.textContent = n + ' i/s · pire image ' + Math.round(worst) + ' ms'; box.style.color = n >= 50 ? '#9fe8a0' : n >= 30 ? '#ffd166' : '#ff6b6b'; n = 0; worst = 0; last = t; }
    requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
